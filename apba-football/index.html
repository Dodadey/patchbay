/* =========================== season totals =========================== */
function seasonTotals(){
  var teams = {}, players = {};
  DB.order.forEach(function(id){
    var g = DB.games[id];
    if(!g || !g.plays.length) return;
    var d = derive(g);
    ['away','home'].forEach(function(t){
      var abbr = g.teams[t].abbr || t.toUpperCase();
      if(!teams[abbr]) teams[abbr] = { abbr: abbr, name: g.teams[t].name, gp:0, w:0, l:0, tie:0, pf:0, pa:0 };
      var T = teams[abbr];
      var me = d.st.score[t], them = d.st.score[other(t)];
      T.gp++; T.pf += me; T.pa += them;
      if(me > them) T.w++; else if(me < them) T.l++; else T.tie++;
      for(var k in d.S.p){
        if(k.indexOf(t + ':') !== 0) continue;
        var pid = k.slice(t.length + 1), pl = null, r = g.teams[t].roster;
        for(var j = 0; j < r.length; j++) if(r[j].id === pid) pl = r[j];
        if(!pl) continue;
        var key = abbr + '|' + pl.num + '|' + (pl.name || pl.pos);
        if(!players[key]) players[key] = {
          team: abbr, num: pl.num, pos: pl.pos,
          name: pl.name || ('#' + pl.num + ' ' + pl.pos), gp: 0, s: newPlayerStat()
        };
        var P = players[key];
        P.gp++;
        var src = d.S.p[k];
        for(var f in P.s){
          if(f.indexOf('long') >= 0) P.s[f] = Math.max(P.s[f], src[f] || 0);
          else P.s[f] += src[f] || 0;
        }
      }
    });
  });
  return { teams: teams, players: players };
}
function renderSeason(){
  var b = $('seasonBody');
  b.textContent = '';
  var S = seasonTotals();
  var tl = Object.keys(S.teams).map(function(k){ return S.teams[k]; });

    b.appendChild(el('div', 'note', 'Nothing yet — season totals build up from every game kept on this iPad.'));
    $('ovSeason').hidden = false;
    return;
  }
  tl.sort(function(a, c){ return (c.w - c.l) - (a.w - a.l) || (c.pf - c.pa) - (a.pf - a.pa); });
  b.appendChild(el('h3', 'sec', 'Standings'));
  tbl(b, ['Club','G','W','L','T','PF','PA','Diff'], tl.map(function(t){
    return [t.name + ' (' + t.abbr + ')', t.gp, t.w, t.l, t.tie, t.pf, t.pa, plus(t.pf - t.pa)];
  }));

  var pl = Object.keys(S.players).map(function(k){ return S.players[k]; });
  function leaders(title, filter, head, row, sort){
    var list = pl.filter(filter).sort(sort);
    if(!list.length) return;
    b.appendChild(el('h3', 'sec', title));
    tbl(b, head, list.map(row));
  }
  leaders('Passing', function(p){ return p.s.pa > 0; },
    ['Player','Tm','G','C-A','Yds','TD','Int','Sk','Rtg'],
    function(p){ return [p.name, p.team, p.gp, p.s.pc + '-' + p.s.pa, p.s.py, p.s.ptd, p.s.pint, p.s.sk, rating(p.s) || '—']; },
    function(a, c){ return c.s.py - a.s.py; });
  leaders('Rushing', function(p){ return p.s.ra > 0; },
    ['Player','Tm','G','Att','Yds','Avg','TD','Lg'],
    function(p){ return [p.name, p.team, p.gp, p.s.ra, p.s.ry, avg(p.s.ry, p.s.ra), p.s.rtd, p.s.rlong]; },
    function(a, c){ return c.s.ry - a.s.ry; });
  leaders('Receiving', function(p){ return p.s.rec > 0; },
    ['Player','Tm','G','Rec','Yds','Avg','TD','Lg'],
    function(p){ return [p.name, p.team, p.gp, p.s.rec, p.s.recy, avg(p.s.recy, p.s.rec), p.s.rectd, p.s.reclong]; },
    function(a, c){ return c.s.recy - a.s.recy; });
  leaders('Kicking', function(p){ return (p.s.fga + p.s.xpa) > 0; },
    ['Player','Tm','G','FG','XP','Lg','Pts'],
    function(p){ return [p.name, p.team, p.gp, p.s.fgm + '/' + p.s.fga, p.s.xpm + '/' + p.s.xpa,
      p.s.fglong || '—', p.s.fgm * 3 + p.s.xpm]; },
    function(a, c){ return (c.s.fgm * 3 + c.s.xpm) - (a.s.fgm * 3 + a.s.xpm); });
  leaders('Punting', function(p){ return p.s.pn > 0; },
    ['Player','Tm','G','No','Yds','Avg','Lg','I20'],
    function(p){ return [p.name, p.team, p.gp, p.s.pn, p.s.pny, avg(p.s.pny, p.s.pn), p.s.pnlong, p.s.in20]; },
    function(a, c){ return c.s.pn - a.s.pn; });
  leaders('Defence', function(p){ return (p.s.dint + p.s.dsack + p.s.dfr) > 0; },
    ['Player','Tm','G','Sacks','Int','Yds','TD','FR'],
    function(p){ return [p.name, p.team, p.gp, p.s.dsack, p.s.dint, p.s.dinty, p.s.dtd, p.s.dfr]; },
    function(a, c){ return (c.s.dsack + c.s.dint) - (a.s.dsack + a.s.dint); });
  $('ovSeason').hidden = false;
}

/* ============================== exports ============================== */
function download(name, text, mime){
  try{
    var blob = new Blob([text], { type: mime || 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = el('a');
    a.href = url; a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 500);
    toast('Saved ' + name, 'good');
  }catch(e){ toast('Could not save that file.', 'bad'); }
}
function copyOut(text){
  function done(){ toast('Copied — paste it wherever you like.', 'good'); }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, fallback);
  }else fallback();
  function fallback(){
    var ta = el('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand('copy'); done(); }
    catch(e){ toast('Select the text and copy it by hand.', 'bad'); }
    ta.remove();
  }
}
function boxText(){
  var g = G(), d = D, L = [];
  var A = g.teams.away.abbr, H = g.teams.home.abbr;
  L.push(g.teams.away.name + ' at ' + g.teams.home.name);
  L.push([g.date, g.label, g.venue].filter(Boolean).join('  ·  '));
  L.push('');
  var qs = d.st.line.away.length;
  var hdr = ['     ']; for(var i = 0; i < qs; i++) hdr.push(i >= 4 ? 'OT' : String(i + 1));
  hdr.push('  T');
  L.push(hdr.join('  '));
  ['away','home'].forEach(function(t){
    var r = [(g.teams[t].abbr + '    ').slice(0, 5)];
    d.st.line[t].forEach(function(v){ r.push(String(v)); });
    r.push(' ' + d.st.score[t]);
    L.push(r.join('  '));
  });
  L.push('');
  L.push('SCORING');
  d.rows.forEach(function(r){
    if(!r.ev.score) return;
    L.push('  Q' + r.pre.qtr + ' ' + (g.rules.clockMode === 'time' ? mmss(r.pre.clock) + ' ' : '') +
      g.teams[r.ev.score.team].abbr + ' — ' + describe(r) +
      ' (' + A + ' ' + r.post.score.away + ', ' + H + ' ' + r.post.score.home + ')');
  });
  L.push('');
  L.push('TEAM' + '                        ' + A + '   ' + H);
  var T = d.S.t;
  function line(label, a, h){
    L.push('  ' + (label + '                          ').slice(0, 26) + String(a) + '   ' + String(h));
  }
  line('First downs', T.away.fd.t, T.home.fd.t);
  line('Total net yards', T.away.net, T.home.net);
  line('Rushing (att-yds)', T.away.ra + '-' + T.away.ry, T.home.ra + '-' + T.home.ry);
  line('Passing (c-a-i)', T.away.pc + '-' + T.away.pa + '-' + T.away.pint,
                          T.home.pc + '-' + T.home.pa + '-' + T.home.pint);
  line('Passing yards', T.away.py, T.home.py);
  line('Sacked (n-yds)', T.away.sk + '-' + T.away.sky, T.home.sk + '-' + T.home.sky);
  line('Punts (n-avg)', T.away.punt.n + '-' + avg(T.away.punt.y, T.away.punt.n),
                        T.home.punt.n + '-' + avg(T.home.punt.y, T.home.punt.n));
  line('Penalties (n-yds)', T.away.pen.n + '-' + T.away.pen.y, T.home.pen.n + '-' + T.home.pen.y);
  line('Turnovers', T.away.to, T.home.to);
  line('Time of possession', mmss(T.away.pos), mmss(T.home.pos));
  L.push('');
  ['away','home'].forEach(function(t){
    L.push(g.teams[t].name.toUpperCase());
    [['pass','Passing', function(s){ return s.pc + '-' + s.pa + ', ' + s.py + ' yds, ' + s.ptd + ' TD, ' + s.pint + ' int'; }],
     ['rush','Rushing', function(s){ return s.ra + ' att, ' + s.ry + ' yds, ' + s.rtd + ' TD'; }],
     ['rec','Receiving', function(s){ return s.rec + ' rec, ' + s.recy + ' yds, ' + s.rectd + ' TD'; }],
     ['kick','Kicking', function(s){ return 'FG ' + s.fgm + '/' + s.fga + ', XP ' + s.xpm + '/' + s.xpa +
        (s.pn ? ', ' + s.pn + ' punts ' + avg(s.pny, s.pn) : ''); }],
     ['def','Defence', function(s){ return s.dsack + ' sacks, ' + s.dint + ' int, ' + s.dfr + ' fum rec'; }]
    ].forEach(function(k){
      var rows = statRows(d, t, k[0]);
      if(!rows.length) return;
      L.push('  ' + k[1]);
      rows.forEach(function(r){ L.push('    ' + r.name + ' — ' + k[2](r.s)); });
    });
    L.push('');
  });
  L.push('PLAY BY PLAY');
  d.rows.forEach(function(r){ L.push('  ' + situation(r.pre, g) + '  ' + describe(r)); });
  return L.join('\n');
}
function seasonText(){
  var S = seasonTotals(), L = ['SEASON TOTALS', ''];
  var tl = Object.keys(S.teams).map(function(k){ return S.teams[k]; })
    .sort(function(a, c){ return (c.w - c.l) - (a.w - a.l); });
  L.push('STANDINGS');
  tl.forEach(function(t){
    L.push('  ' + (t.name + '                    ').slice(0, 20) + t.w + '-' + t.l + '-' + t.tie +
      '   PF ' + t.pf + '  PA ' + t.pa);
  });
  var pl = Object.keys(S.players).map(function(k){ return S.players[k]; });
  function sect(title, filter, fmt, sort){
    var list = pl.filter(filter).sort(sort);
    if(!list.length) return;
    L.push(''); L.push(title.toUpperCase());
    list.forEach(function(p){ L.push('  ' + p.name + ' (' + p.team + ') — ' + fmt(p)); });
  }
  sect('Passing', function(p){ return p.s.pa > 0; },
    function(p){ return p.s.pc + '-' + p.s.pa + ', ' + p.s.py + ' yds, ' + p.s.ptd + ' TD, ' + p.s.pint + ' int, rtg ' + (rating(p.s) || '—'); },
    function(a, c){ return c.s.py - a.s.py; });
  sect('Rushing', function(p){ return p.s.ra > 0; },
    function(p){ return p.s.ra + ' att, ' + p.s.ry + ' yds, ' + avg(p.s.ry, p.s.ra) + ' avg, ' + p.s.rtd + ' TD'; },
    function(a, c){ return c.s.ry - a.s.ry; });
  sect('Receiving', function(p){ return p.s.rec > 0; },
    function(p){ return p.s.rec + ' rec, ' + p.s.recy + ' yds, ' + p.s.rectd + ' TD'; },
    function(a, c){ return c.s.recy - a.s.recy; });
  sect('Defence', function(p){ return (p.s.dint + p.s.dsack) > 0; },
    function(p){ return p.s.dsack + ' sacks, ' + p.s.dint + ' int'; },
    function(a, c){ return (c.s.dsack + c.s.dint) - (a.s.dsack + a.s.dint); });
  return L.join('\n');
}

/* ================================ boot =============================== */
function importGame(text){
  var o;
  try{ o = JSON.parse(text); }
  catch(e){ toast('That is not a game file.', 'bad'); return; }
  if(!o || !o.teams || !Array.isArray(o.plays)){ toast('That file has no game in it.', 'bad'); return; }
  o.id = o.id && !DB.games[o.id] ? o.id : uid('g');
  DB.games[o.id] = o;
  DB.order.unshift(o.id);
  DB.current = o.id;
  saveDB(); render();
  $('ovGames').hidden = true;
  toast('Imported ' + o.teams.away.abbr + ' at ' + o.teams.home.abbr + '.', 'good');
}

var fileMode = 'game';

function importClubs(text){
  var o;
  try{ o = JSON.parse(text); }
  catch(e){ toast('That is not a club file.', 'bad'); return; }
  var map = o && o.clubs ? o.clubs : o;
  if(Array.isArray(map)){
    var byKey = {};
    map.forEach(function(c){ if(c && c.roster) byKey[c.key || clubKey(c.abbr, c.name)] = c; });
    map = byKey;
  }
  if(!map || typeof map !== 'object'){ toast('No clubs in that file.', 'bad'); return; }
  var n = 0;
  Object.keys(map).forEach(function(k){
    var c = map[k];
    if(!c || !Array.isArray(c.roster)) return;
    var key = c.key || clubKey(c.abbr, c.name);
    DB.clubs[key] = {
      key: key, name: c.name || key, abbr: c.abbr || key.slice(0, 3),
      color: c.color || CLUB_COLOURS[n % CLUB_COLOURS.length], roster: c.roster
    };
    n++;
  });
  if(!n){ toast('No clubs in that file.', 'bad'); return; }
  saveDB(); renderClubs();
  $('ovClubs').hidden = false;
  toast(n + ' club' + (n === 1 ? '' : 's') + ' in.', 'good');
}

function wire(){
  $('commit').addEventListener('click', commitPad);
  $('btnUndo').addEventListener('click', undo);
  $('btnBox').addEventListener('click', renderBox);
  $('btnMore').addEventListener('click', renderMenu);
  $('btnDrives').addEventListener('click', renderDrives);
  $('btnJumpEnd').addEventListener('click', function(){
    var l = $('log'); l.scrollTop = l.scrollHeight;
  });
  $('sideAway').addEventListener('click', function(){ openRoster('away'); });
  $('sideHome').addEventListener('click', function(){ openRoster('home'); });

  [['boxClose','ovBox'],['drivesClose','ovDrives'],['menuClose','ovMenu'],
   ['rosterClose','ovRoster'],['setupClose','ovSetup'],['gamesClose','ovGames'],
   ['clubsClose','ovClubs'],
   ['seasonClose','ovSeason'],['editClose','ovEdit']].forEach(function(p){
    $(p[0]).addEventListener('click', function(){ $(p[1]).hidden = true; render(); });
  });
  $('boxText').addEventListener('click', function(){ copyOut(boxText()); });
  $('boxJSON').addEventListener('click', function(){
    download(fileName(G()) + '.json', JSON.stringify(G(), null, 1));
  });
  $('seasonText').addEventListener('click', function(){ copyOut(seasonText()); });
  $('rosterAdd').addEventListener('click', function(){
    var T = rosterObj();
    if(!T) return;
    T.roster.push({ id: uid('p'), num: 0, pos: '—', name: '' });
    saveDB(); renderRoster();
  });
  $('rosterPaste').addEventListener('click', function(){ pasteOpen = !pasteOpen; renderRoster(); });
  $('rosterSave').addEventListener('click', function(){
    if(rosterRef.kind === 'team') saveClubFromGame(rosterRef.team);
  });
  $('clubsPaste').addEventListener('click', function(){ clubsPasteOpen = !clubsPasteOpen; renderClubs(); });
  $('clubsExport').addEventListener('click', function(){
    var list = clubArray();
    if(!list.length){ toast('The library is empty.', 'bad'); return; }
    download('apba-clubs.json', JSON.stringify({ clubs: DB.clubs }, null, 1));
  });
  $('clubsImport').addEventListener('click', function(){ fileMode = 'clubs'; $('fileIn').click(); });
  $('gamesNew').addEventListener('click', function(){
    var ng = newGame(G());
    DB.games[ng.id] = ng; DB.order.unshift(ng.id); DB.current = ng.id;
    saveDB(); render(); renderGames();
  });
  $('gamesImport').addEventListener('click', function(){ fileMode = 'game'; $('fileIn').click(); });
  $('fileIn').addEventListener('change', function(e){
    var f = e.target.files[0];
    if(!f) return;
    var mode = fileMode;
    var rd = new FileReader();
    rd.onload = function(){
      if(mode === 'clubs') importClubs(String(rd.result));
      else importGame(String(rd.result));
    };
    rd.readAsText(f);
    e.target.value = '';
    fileMode = 'game';
  });

  /* the dice, read the APBA way: white die first, red second */
  function cycle(key, node){
    pad[key] = (num(pad[key], 0) % 6) + 1;
    node.textContent = pad[key];
  }
  $('dieW').addEventListener('click', function(){ cycle('dW', $('dieW')); });
  $('dieR').addEventListener('click', function(){ cycle('dR', $('dieR')); });
  $('btnRoll').addEventListener('click', function(){
    pad.dW = 1 + Math.floor(Math.random() * 6);
    pad.dR = 1 + Math.floor(Math.random() * 6);
    $('dieW').textContent = pad.dW;
    $('dieR').textContent = pad.dR;
    toast('Rolled ' + pad.dW + '-' + pad.dR + '  (' + pad.dW + '' + pad.dR + ')');
  });
  $('inPRN').addEventListener('input', function(){ pad.prn = $('inPRN').value; });
  $('inDef').addEventListener('input', function(){ pad.defCall = $('inDef').value; });

  document.addEventListener('keydown', function(e){
    if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if(e.key === 'Escape'){
      ['ovBox','ovDrives','ovMenu','ovRoster','ovSetup','ovGames','ovSeason','ovEdit','ovClubs']
        .forEach(function(id){ $(id).hidden = true; });
      render();
    }
    if(e.key === 'Enter'){ e.preventDefault(); commitPad(); }
    if(e.key === 'u') undo();
    if(e.key === 'b') renderBox();
    if(e.key === 'r'){ $('btnRoll').click(); }
  });

  window.addEventListener('beforeunload', saveDB);
}

loadDB();
wire();
render();

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){ /* file:// or no SW — the app still runs */ });
  });
}
</script>
